name: Narya-Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build, Test Native AArch64 MAP_JIT, Merkle Build & Verify Zero-Sorry
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure ripgrep & C toolchain
        run: |
          uname -a
          cc --version
          command -v rg >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ripgrep)

      - name: Build & Test with Lean 4 (Native AArch64 + W^X mprotect JIT)
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: true

      - name: Exercise Merkle Package Builder (.ny & .narya), Unison Digests, Translator, Profiler & JIT
        run: |
          lake exe narya build stdlib --rebuild
          lake exe narya build stdlib | tee /tmp/narya_cached_build.txt
          rg "0 built, 4 cached" /tmp/narya_cached_build.txt
          lake exe narya build stdlib_modern --rebuild
          lake exe narya build stdlib_modern | tee /tmp/narya_mod_cached.txt
          rg "0 built, 4 cached" /tmp/narya_mod_cached.txt
          lake exe narya hash stdlib_modern
          lake exe narya run examples/modern_showcase.narya
          lake exe narya translate examples/univalence_and_modal.ny --out /tmp/ci_translated.narya
          lake exe narya run /tmp/ci_translated.narya
          lake exe narya profile stdlib/collatz.ny --json /tmp/narya_trace.json --folded /tmp/narya.folded
          lake exe narya profile stdlib_modern/collatz.narya --json /tmp/narya_mod_trace.json
          test -s /tmp/narya_trace.json
          test -s /tmp/narya_mod_trace.json
          test -s /tmp/narya.folded
          lake exe narya jit
          lake exe narya bench

      - name: Verify Zero Sorry & Zero Noncomputable
        run: |
          if rg -n -w "sorry" Narya Main.lean Tests | rg -v -e '--' -e '`.*sorry.*`' -e '\*.*sorry'; then
            echo "ERROR: Found tactic 'sorry' in codebase!"
            exit 1
          fi
          if rg -n -w "noncomputable" Narya Main.lean Tests | rg -v -e '--' -e '`.*noncomputable.*`' -e '\*.*noncomputable'; then
            echo "ERROR: Found 'noncomputable' declaration in codebase!"
            exit 1
          fi
          echo "Verified: zero 'sorry' tactics and zero 'noncomputable' definitions."
